name: Build module 8 DOCX files

on:
  push:
    branches:
      - chatgpt-docx-module8-20260729
    paths:
      - tmp_build_module8_docs.py
      - .github/workflows/build_module8_docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-docx-module8-20260729

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Generate documents
        run: python tmp_build_module8_docs.py

      - name: Validate DOCX packages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile
          from docx import Document

          files = sorted(p for p in Path('generated_docs').glob('*.docx') if not p.name.startswith('work0'))
          assert len(files) == 4, f'Expected 4 DOCX files, got {len(files)}'
          for file in files:
              assert is_zipfile(file), f'Not a ZIP package: {file}'
              with ZipFile(file) as z:
                  names = set(z.namelist())
                  assert '[Content_Types].xml' in names
                  assert 'word/document.xml' in names
              doc = Document(file)
              assert len(doc.paragraphs) > 80, f'Too few paragraphs: {file}'
              assert len(doc.tables) >= 8, f'Too few tables: {file}'
              text = '\n'.join(p.text for p in doc.paragraphs)
              for heading in ('Аннотация', 'Критерии оценивания', 'Чек-лист самопроверки', 'Приложения'):
                  assert heading in text, f'Missing {heading} in {file}'
              print(file.name, len(doc.paragraphs), len(doc.tables))
          PY

      - name: Create ASCII download aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(p for p in Path('generated_docs').glob('*.docx') if not p.name.startswith('work0'))
          for index, source in enumerate(files, 1):
              target = source.with_name(f'work{index:02d}.docx')
              target.write_bytes(source.read_bytes())
              print(target)
          PY

      - name: Commit generated files
        run: |
          git config user.name "chatgpt-doc-builder"
          git config user.email "chatgpt-doc-builder@users.noreply.github.com"
          git add generated_docs/*.docx
          if git diff --cached --quiet; then
            echo "No document changes"
          else
            git commit -m "Generate module 8 DOCX practical works"
            git push origin HEAD:chatgpt-docx-module8-20260729
          fi
